[package]
name = "weedhack"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "boot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png"] }
webp = "0.3"
xcap = "0.0.14"
enigo = "0.2"
sysinfo = "0.32"
nokhwa = { version = "0.10", features = ["input-native"] }
zip = "2"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = "z"      
lto = "thin"         
codegen-units = 16   
panic = "abort"
strip = true         