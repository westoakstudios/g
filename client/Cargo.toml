[package]
name = "weedhack"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "boot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = "2"
walkdir = "2"

[profile.release]
opt-level = "z"
lto = false
codegen-units = 16
panic = "abort"
strip = true