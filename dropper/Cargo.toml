[package]
name = "boot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "boot"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",         # <--- ADDED THIS
    "Win32_System_Threading",
    "Win32_Networking_WinInet"
] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true