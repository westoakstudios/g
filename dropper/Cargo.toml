[package]
name = "boot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "boot"
path = "src/main.rs"

[dependencies]
walkdir = "2" 
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Networking_WinInet"
] }

[profile.release]
opt-level = "z"      # Optimize for size
lto = false          # <--- Disabled for fast compilation
codegen-units = 16   # <--- Default for fast compilation
panic = "abort"
strip = true