<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeedHack — console</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #000; }
  .wrap { height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; flex-shrink: 0;
    background: #000;
    border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
  }
  .topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
  .topbar .label { color: var(--muted); letter-spacing: .16em; text-transform: uppercase; font-size: 10px; font-weight: 600; }
  .topbar .target { color: var(--text); font-family: var(--mono); }
  .topbar .spacer { flex: 1; }

  .shelltabs {
    display: flex; gap: 4px;
    background: #000;
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    padding: 4px;
  }
  .shelltabs button {
    margin: 0; padding: 7px 18px; font-size: 11px; font-weight: 700;
    font-family: var(--mono);
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; border-radius: var(--r-pill); box-shadow: none;
  }
  .shelltabs button.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #000;
  }
  .shelltabs button:hover:not(.active) { color: var(--text); }

  .term {
    flex: 1; overflow-y: auto;
    padding: 20px 24px;
    font-family: var(--mono); font-size: 13px; line-height: 1.6;
    color: var(--text);
    background-image:
      linear-gradient(rgba(79,195,247,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,195,247,.02) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .blk {
    margin-bottom: 16px;
    padding: 12px 16px;
    background: #05050a;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
  }
  .blk .cmdline { color: var(--accent); word-break: break-all; white-space: pre-wrap; font-weight: 500; }
  .blk .cmdline .prompt { color: var(--muted); margin-right: 6px; }
  .blk .out { color: var(--text); white-space: pre-wrap; word-break: break-word; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .blk .status { color: var(--muted); font-size: 11px; margin-top: 8px; display: flex; gap: 10px; align-items: center; }
  .blk .status.pending::before {
    content: ""; display: inline-block;
    width: 8px; height: 8px; border-radius: 50%;
    border: 2px solid var(--accent); border-top-color: transparent;
    animation: spin .7s linear infinite;
  }
  .blk .status.err { color: var(--orange); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bottom {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    background: #000;
  }
  .bottom .ps1 { color: var(--accent); font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .bottom input {
    flex: 1; background: transparent; border: none; color: #fff;
    font-family: var(--mono); font-size: 13px; padding: 6px 0; margin: 0;
    outline: none; box-shadow: none; border-radius: 0;
  }
  .bottom input:focus { box-shadow: none; background: transparent; }

  .empty { color: var(--muted); padding: 40px; text-align: center; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="dot"></span>
    <span class="label">console</span>
    <span class="target" id="target">—</span>
    <span class="spacer"></span>
    <div class="shelltabs">
      <button data-shell="cmd">cmd</button>
      <button data-shell="powershell">powershell</button>
    </div>
    <button class="ghost mini" id="clear">clear</button>
  </div>
  <div class="term" id="term">
    <div class="empty">type a command below and press enter</div>
  </div>
  <div class="bottom">
    <span class="ps1" id="ps1">C:\&gt;</span>
    <input id="cmdline" autocomplete="off" spellcheck="false" placeholder="type a command…" autofocus>
  </div>
</div>
<script src="/js/cmd.js"></script>
</body>
</html>
