<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeedHack — console</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="window">
  <div class="topbar">
    <span class="dot on"></span>
    <span class="lbl">console</span>
    <span class="target" id="target">—</span>
    <span class="spacer"></span>
    <div class="shelltabs">
      <button data-shell="cmd">cmd</button>
      <button data-shell="powershell">powershell</button>
    </div>
    <button class="ghost mini" id="clear">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      clear
    </button>
  </div>
  <div class="term" id="term">
    <div class="empty">type a command below and press enter</div>
  </div>
  <div class="cmdbar">
    <span class="ps1" id="ps1">C:\&gt;</span>
    <input id="cmdline" autocomplete="off" spellcheck="false" placeholder="type a command…" autofocus>
  </div>
</div>
<script src="/js/cmd.js"></script>
</body>
</html>
