<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeedHack — console</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { background: #050203; }
  .term-wrap { height: 100vh; display: flex; flex-direction: column; padding: 0; }
  .term-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: linear-gradient(180deg, #1a0a18, #120710);
    border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
    letter-spacing: .12em; text-transform: uppercase;
  }
  .term-bar .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green-2); box-shadow: 0 0 8px var(--green-2); }
  .term-bar .shell { color: var(--orange-2); }
  .term-bar .target { color: var(--text); text-transform: none; letter-spacing: 0; }
  .term {
    flex: 1; overflow-y: auto;
    padding: 16px 18px;
    font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace;
    font-size: 13px; line-height: 1.5;
    color: #d8c8d4;
    background: #050203;
  }
  .term .line { white-space: pre-wrap; word-break: break-word; }
  .term .prompt { color: var(--green-2); }
  .term .in { color: var(--orange-2); }
  .term .err { color: #e0555c; }
  .term .meta { color: var(--muted); font-size: 11px; }
  .term-input {
    display: flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--line);
    background: #0a0410;
    padding: 10px 16px;
  }
  .term-input .ps1 { color: var(--green-2); font-family: ui-monospace, monospace; font-size: 13px; }
  .term-input input {
    flex: 1; background: transparent; border: none; color: #fff;
    font-family: ui-monospace, monospace; font-size: 13px;
    padding: 0; margin: 0; outline: none;
  }
  .term-input input:focus { box-shadow: none; }
</style>
</head>
<body>
<div class="term-wrap">
  <div class="term-bar">
    <span class="dot"></span>
    <span>WeedHack console</span>
    <span class="shell" id="bar-shell">cmd</span>
    <span class="target" id="bar-target">—</span>
  </div>
  <div class="term" id="term"></div>
  <div class="term-input">
    <span class="ps1" id="ps1">C:\&gt;</span>
    <input id="cmdline" autocomplete="off" spellcheck="false" placeholder="type a command and press enter">
  </div>
</div>
<script src="/js/cmd.js"></script>
</body>
</html>
