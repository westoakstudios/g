<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeedHack — your keys</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="center">
  <div class="card">
    <div class="brand"><span class="w">Weed</span><span class="h">Hack</span></div>
    <h1>save your keys</h1>
    <div class="sub">both shown once here, and sent to your discord webhook.</div>

    <label>account key — for the client</label>
    <div class="keybox" id="akey">—</div>

    <label>login token — for signing in</label>
    <div class="keybox" id="ltok">—</div>

    <button class="ghost" id="copy">copy both</button>
    <button class="ghost" id="next">continue to dashboard</button>
    <div class="err" id="err"></div>
  </div>
</div>
<script src="/js/key.js"></script>
</body>
</html>
