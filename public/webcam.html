<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeedHack — webcam</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="window">
  <div class="topbar">
    <span class="dot" id="dot"></span>
    <span class="target" id="target">—</span>
    <span class="lbl">cam</span>
    <select id="camera"><option value="0">0</option></select>
    <span class="lbl">quality</span>
    <select id="preset">
      <option value="low">low</option>
      <option value="med" selected>medium</option>
      <option value="high">high</option>
    </select>
    <span class="spacer"></span>
    <span class="fps" id="fps"></span>
    <button id="stop" class="danger">disconnect</button>
  </div>
  <div class="stage" id="stage"><div class="wait">waiting for first frame…</div></div>
</div>
<script src="/js/webcam.js"></script>
</body>
</html>
