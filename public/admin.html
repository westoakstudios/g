<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Portal</title>
<link rel="icon" type="image/png" href="/Weedhack.png?v=2">
<link rel="stylesheet" href="/css/style.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; background: var(--bg); }
  .admin-card { width: 100%; max-width: 420px; padding: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
  h1 { margin-bottom: 20px; font-size: 20px; }
  #admin-panel { display: none; }
</style>
</head>
<body>
  <div class="admin-card">
    <div id="login-section">
      <h1>Admin Login</h1>
      <div class="sub">Restricted access.</div>
      
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password">
      
      <button class="primary" id="btn-login" style="margin-top: 20px; width: 100%;">Login</button>
      <div class="err" id="msg-login" style="margin-top: 15px;"></div>
    </div>

    <div id="admin-panel">
      <h1>Premium Manager</h1>
      <div class="sub">Upgrade or remove a user's account.</div>
      
      <label>Account Key</label>
      <input type="text" id="accountKey" placeholder="XXXX-XXXX-XXXX-XXXX">
      
      <label>Duration</label>
      <select id="days">
        <option value="1">1 Day</option>
        <option value="7">1 Week</option>
        <option value="30" selected>1 Month</option>
        <option value="90">3 Months</option>
        <option value="365">1 Year</option>
        <option value="36500">Lifetime (100 Years)</option>
      </select>
      
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="primary" id="btn-upgrade" style="flex: 1;">Add Premium</button>
        <button class="ghost" id="btn-remove" style="flex: 1; border-color: rgba(248,113,113,.35); color: var(--red);">Remove Premium</button>
      </div>
      
      <div class="err" id="msg" style="margin-top: 15px;"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let savedPassword = '';

    $('btn-login').addEventListener('click', async () => {
      const password = $('password').value;
      const msg = $('msg-login');
      
      msg.textContent = 'Verifying...';
      msg.style.color = 'var(--muted)';
      $('btn-login').disabled = true;

      try {
        const r = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        if (r.ok) {
          savedPassword = password;
          $('login-section').style.display = 'none';
          $('admin-panel').style.display = 'block';
        } else {
          const d = await r.json().catch(() => ({}));
          msg.textContent = d.error || 'Invalid password';
          msg.style.color = 'var(--red)';
        }
      } catch (e) {
        msg.textContent = 'Network error';
        msg.style.color = 'var(--red)';
      }
      
      $('btn-login').disabled = false;
    });

    async function callAdmin(endpoint) {
      const accountKey = $('accountKey').value;
      const days = $('days').value;
      const msg = $('msg');
      
      if (!accountKey) {
        msg.textContent = 'Account Key is required.';
        msg.style.color = 'var(--red)';
        return;
      }

      msg.textContent = 'Processing...';
      msg.style.color = 'var(--muted)';
      $('btn-upgrade').disabled = true;
      $('btn-remove').disabled = true;

      try {
        const r = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: savedPassword, accountKey, days })
        });
        const d = await r.json();

        if (r.ok) {
          msg.textContent = d.message;
          msg.style.color = 'var(--green)';
        } else {
          msg.textContent = d.error || 'Failed';
          msg.style.color = 'var(--red)';
        }
      } catch (e) {
        msg.textContent = 'Network error';
        msg.style.color = 'var(--red)';
      }
      
      $('btn-upgrade').disabled = false;
      $('btn-remove').disabled = false;
    }

    $('btn-upgrade').addEventListener('click', () => callAdmin('/api/admin/upgrade'));
    $('btn-remove').addEventListener('click', () => callAdmin('/api/admin/remove'));
  </script>
</body>
</html>
