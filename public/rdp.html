<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeedHack — screen</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #000; }
  .wrap { height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px; flex-shrink: 0;
    background: #000;
    border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
    flex-wrap: wrap;
  }
  .topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); transition: background .2s, box-shadow .2s; }
  .topbar .dot.on { background: var(--green); box-shadow: 0 0 12px var(--green); }
  .topbar .target { color: var(--text); font-family: var(--mono); font-size: 12px; }
  .topbar .spacer { flex: 1; }
  .topbar .fps { font-family: var(--mono); font-size: 11px; color: var(--accent); min-width: 48px; text-align: right; font-weight: 600; }
  .topbar select, .topbar button {
    margin: 0; padding: 8px 16px; font-size: 11px; font-weight: 600; width: auto;
    background: transparent; border: 1px solid var(--line-2); color: var(--text);
    border-radius: var(--r-pill); cursor: pointer; font-family: inherit; box-shadow: none;
  }
  .topbar select:hover, .topbar button:hover:not([disabled]) { border-color: var(--accent); color: var(--accent); }
  .topbar button.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #000;
    box-shadow: 0 4px 20px rgba(79,195,247,.4);
  }
  .topbar .lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .topbar select { padding-right: 34px; }

  .stage {
    flex: 1; overflow: auto; display: grid; place-items: center;
    background: #000;
    padding: 16px; position: relative;
    background-image:
      linear-gradient(rgba(79,195,247,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,195,247,.03) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .stage img {
    max-width: 100%; max-height: 100%;
    image-rendering: -webkit-optimize-contrast;
    user-select: none; -webkit-user-drag: none;
    outline: none; cursor: crosshair;
    background: #000;
    border: 1px solid var(--line-2);
    border-radius: var(--r-md);
    box-shadow: 0 0 60px rgba(79, 195, 247, .2);
  }
  .stage .wait { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="dot" id="dot"></span>
    <span class="target" id="target">—</span>
    <span class="lbl">monitor</span>
    <select id="monitor"><option value="0">loading…</option></select>
    <span class="lbl">quality</span>
    <select id="preset">
      <option value="low">low</option>
      <option value="med" selected>medium</option>
      <option value="high">high</option>
      <option value="native">native</option>
    </select>
    <span class="spacer"></span>
    <span class="fps" id="fps"></span>
    <button id="kb" title="keyboard">⌨</button>
    <button id="mouse" title="mouse">🖱</button>
    <button id="reset" title="release all keys and buttons">reset</button>
    <button id="stop" style="border-color:var(--red);color:var(--red)">disconnect</button>
  </div>
  <div class="stage" id="stage">
    <div class="wait">waiting for first frame…</div>
  </div>
</div>
<script src="/js/rdp.js"></script>
</body>
</html>
