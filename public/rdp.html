<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeedHack — screen</title>
<link rel="icon" type="image/png" href="/Weedhack.png?v=2">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="window">
  <div class="topbar">
    <span class="dot" id="dot"></span>
    <span class="target" id="target">—</span>
    <span class="lbl">monitor</span>
    <select id="monitor"><option value="0">loading…</option></select>
    <span class="lbl">quality</span>
    <select id="preset">
      <option value="low">low</option>
      <option value="med" selected>medium</option>
      <option value="high">high</option>
      <option value="native">native</option>
    </select>
    <span class="lbl">fps</span>
    <input id="fps-slider" type="range" min="1" max="60" step="1" value="10">
    <span class="fps-val" id="fps-val">10</span>

    <span class="fps" id="fps">
      <span id="fps-now">0</span>
      <span style="color:var(--muted-2)">/</span>
      <span id="fps-target" style="color:var(--muted)">10</span>
      <span style="color:var(--muted-2)">fps</span>
    </span>

    <span class="spacer"></span>
    <button id="kb" title="keyboard">
      <svg class="icon" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01"/><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/><path d="M7 16h10"/></svg>
    </button>
    <button id="mouse" title="mouse">
      <svg class="icon" viewBox="0 0 24 24"><rect width="14" height="20" x="5" y="2" rx="7"/><path d="M12 6v4"/></svg>
    </button>
    <button id="reset" title="release all keys and buttons">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      reset
    </button>
    <button id="stop" class="danger">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" x2="12" y1="2" y2="12"/></svg>
      disconnect
    </button>
  </div>
  <div class="stage" id="stage">
    <!-- REPLACED IMG WITH VIDEO -->
    <video id="screen" autoplay muted playsinline></video>
  </div>
</div>
<script src="/js/rdp.js"></script>
</body>
</html>
