<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeedHack — screen</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); margin: 0; }

  .wrap { height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
    flex-wrap: wrap;
  }
  .topbar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); transition: background .2s, box-shadow .2s; }
  .topbar .dot.on { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .topbar .target { color: var(--text); font-family: var(--mono); font-size: 12px; }
  .topbar .spacer { flex: 1; }
  .topbar .fps { font-family: var(--mono); font-size: 11px; color: var(--blue-3); min-width: 44px; text-align: right; }
  .topbar select, .topbar button {
    margin: 0; padding: 6px 12px; font-size: 11px; width: auto;
    background: transparent; border: 1px solid var(--line-2); color: var(--text);
    border-radius: 5px; cursor: pointer; font-family: inherit;
    box-shadow: none;
  }
  .topbar select:hover, .topbar button:hover:not([disabled]) { border-color: var(--blue-3); background: rgba(79,195,247,.06); }
  .topbar button.active { background: linear-gradient(135deg, var(--blue), var(--blue-2)); border-color: var(--blue-2); color: #031220; font-weight: 700; box-shadow: 0 4px 14px rgba(41,182,246,.35); }
  .topbar .lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  .stage {
    flex: 1; overflow: auto; display: grid; place-items: center;
    background: #030c17; padding: 12px; position: relative;
  }
  .stage img {
    max-width: 100%; max-height: 100%;
    image-rendering: -webkit-optimize-contrast;
    user-select: none; -webkit-user-drag: none;
    outline: none; cursor: crosshair;
    background: #000;
    border: 1px solid var(--line-2);
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(41,182,246,.15);
  }
  .stage .wait { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="dot" id="dot"></span>
    <span class="target" id="target">—</span>
    <span class="lbl">monitor</span>
    <select id="monitor"><option value="0">loading…</option></select>
    <span class="lbl">quality</span>
    <select id="preset">
      <option value="low">low</option>
      <option value="med" selected>medium</option>
      <option value="high">high</option>
      <option value="native">native</option>
    </select>
    <span class="spacer"></span>
    <span class="fps" id="fps"></span>
    <button id="kb" title="keyboard capture">⌨</button>
    <button id="mouse" title="mouse capture">🖱</button>
    <button id="stop" style="border-color:var(--red);color:var(--red)">disconnect</button>
  </div>
  <div class="stage" id="stage">
    <div class="wait">waiting for first frame…</div>
  </div>
</div>
<script src="/js/rdp.js"></script>
</body>
</html>
