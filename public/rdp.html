<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeedHack — screen</title>
<link rel="icon" type="image/png" href="/Weedhack.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="window">
  <div class="topbar">
    <span class="dot" id="dot"></span>
    <span class="target" id="target">—</span>
    <span class="lbl">monitor</span>
    <select id="monitor"><option value="0">loading…</option></select>
    <span class="lbl">quality</span>
    <select id="preset">
      <option value="low">low</option>
      <option value="med" selected>medium</option>
      <option value="high">high</option>
      <option value="native">native</option>
    </select>
    <span class="lbl">fps</span>
    <input id="fps-slider" type="range" min="1" max="60" step="1" value="10">
    <span class="fps-val" id="fps-val">10</span>

    <span class="fps" id="fps">
      <span id="fps-now">0</span>
      <span style="color:var(--muted-2)">/</span>
      <span id="fps-target" style="color:var(--muted)">10</span>
      <span style="color:var(--muted-2)">fps</span>
    </span>

    <span class="spacer"></span>
    <button id="kb" title="keyboard">⌨</button>
    <button id="mouse" title="mouse">🖱</button>
    <button id="reset" title="release all keys and buttons">reset</button>
    <button id="stop" class="danger">disconnect</button>
  </div>
  <div class="stage" id="stage"></div>
</div>
<script src="/js/rdp.js"></script>
</body>
</html>
