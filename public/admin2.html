<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operations</title>
<link rel="icon" type="image/png" href="/Weedhack.png?v=2">
<link rel="stylesheet" href="/css/style.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; background: var(--bg); padding: 20px; }
  .a2-card { width: 100%; max-width: 640px; padding: 36px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
  h1 { margin-bottom: 8px; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; text-align: center; }
  .stat-k { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .stat-v { font-size: 24px; font-weight: 600; color: var(--text); margin-top: 6px; }
  .stat-v.green { color: var(--green); }
  .list { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-md); max-height: 420px; overflow-y: auto; }
  .list-head { padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; position: sticky; top: 0; background: var(--bg-2); }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .row:last-child { border-bottom: none; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: var(--muted-2); }
  .meta { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  #login-panel, #panel { display: none; }
  #login-panel.active, #panel.active { display: block; }
  .tabs { display: flex; gap: 2px; margin-bottom: 16px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 3px; }
  .tabs button { margin: 0; flex: 1; padding: 8px 12px; font-size: 12px; font-weight: 600; border-radius: var(--r-sm); background: transparent; border: none; color: var(--muted); box-shadow: none; cursor: pointer; }
  .tabs button.active { background: var(--panel-3); color: var(--text); }
</style>
</head>
<body>

  <div class="a2-card" id="login-panel">
    <h1>Operations</h1>
    <div class="sub">Restricted. Authentication required.</div>
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="off" spellcheck="false">
    <button class="primary" id="btn-login" style="margin-top: 18px; width: 100%;">Unlock</button>
    <div class="err" id="msg-login" style="margin-top: 14px;"></div>
  </div>

  <div class="a2-card" id="panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div>
        <h1 style="margin: 0;">Operations</h1>
        <div class="sub" style="margin: 4px 0 0;">global fleet & user view</div>
      </div>
      <button class="ghost mini" id="btn-logout">lock</button>
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="stat-k">online</div><div class="stat-v green" id="s-online">—</div></div>
      <div class="stat"><div class="stat-k">offline</div><div class="stat-v" id="s-offline">—</div></div>
      <div class="stat"><div class="stat-k">total</div><div class="stat-v" id="s-total">—</div></div>
    </div>

    <div class="tabs">
      <button class="active" data-tab="clients">clients</button>
      <button data-tab="users">users</button>
    </div>

    <div id="tab-clients">
      <div class="list">
        <div class="list-head"><span>host</span><span>owner · last seen</span></div>
        <div id="s-rows"><div class="row" style="justify-content:center; color: var(--muted);">loading…</div></div>
      </div>
    </div>

    <div id="tab-users" style="display: none;">
      <div class="list">
        <div class="list-head"><span>user</span><span>login token</span></div>
        <div id="u-rows"><div class="row" style="justify-content:center; color: var(--muted);">loading…</div></div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  let pollTimer = null;
  let currentTab = 'clients';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function fmtAgo(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s / 60)}m`;
    if (s < 86400) return `${Math.floor(s / 3600)}h`;
    return `${Math.floor(s / 86400)}d`;
  }

  function stopPoll() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function showLogin() {
    stopPoll();
    $('login-panel').classList.add('active');
    $('panel').classList.remove('active');
    setTimeout(() => $('password').focus(), 50);
  }

  function showPanel() {
    $('login-panel').classList.remove('active');
    $('panel').classList.add('active');
    loadCurrentTab();
    stopPoll();
    pollTimer = setInterval(loadCurrentTab, 5000);
  }

  async function loadClients() {
    try {
      const r = await fetch('/api/admin2/stats', { credentials: 'same-origin', cache: 'no-store' });
      if (r.status === 401) { showLogin(); return; }
      if (!r.ok) throw new Error('http ' + r.status);
      const d = await r.json();
      
      $('s-online').textContent = d.online;
      $('s-offline').textContent = d.offline;
      $('s-total').textContent = d.total;
      
      const rows = $('s-rows');
      if (!d.rows || d.rows.length === 0) {
        rows.innerHTML = '<div class="row" style="justify-content:center; color: var(--muted);">no clients</div>';
        return;
      }
      rows.innerHTML = d.rows.map(c => `
        <div class="row">
          <span><span class="dot ${c.online ? 'on' : 'off'}"></span>${esc(c.hostname)}</span>
          <span class="meta">${esc(c.username)} · ${fmtAgo(c.lastSeen)}</span>
        </div>
      `).join('');
    } catch (e) {
      $('s-rows').innerHTML = `<div class="row" style="justify-content:center; color: var(--red);">error loading clients: ${esc(e.message)}</div>`;
    }
  }

  async function loadUsers() {
    try {
      const r = await fetch('/api/admin2/users', { credentials: 'same-origin', cache: 'no-store' });
      if (r.status === 401) { showLogin(); return; }
      if (!r.ok) throw new Error('http ' + r.status);
      
      const users = await r.json();
      const rows = $('u-rows');
      
      if (!users || users.length === 0) {
        rows.innerHTML = '<div class="row" style="justify-content:center; color: var(--muted);">no users</div>';
        return;
      }
      
      rows.innerHTML = users.map(u => `
        <div class="row">
          <span>${esc(u.username)}<br><span class="meta">${esc(u.email)}</span></span>
          <span class="meta" style="display:flex; align-items:center; gap:8px;">
            ${esc(u.login_token)}
            <button class="ghost mini" onclick="impersonate(${u.id})">login</button>
          </span>
        </div>
      `).join('');
    } catch (e) {
      $('u-rows').innerHTML = `<div class="row" style="justify-content:center; color: var(--red);">error loading users: ${esc(e.message)}</div>`;
    }
  }

  async function loadCurrentTab() {
    if (currentTab === 'clients') await loadClients();
    else await loadUsers();
  }

  window.impersonate = async function(id) {
    if (!confirm('Log in as this user? You will be redirected to the dashboard.')) return;
    try {
      const r = await fetch(`/api/admin2/impersonate/${id}`, { method: 'POST', credentials: 'same-origin' });
      if (r.ok) location.href = '/dashboard.html';
      else alert('failed to impersonate');
    } catch {
      alert('network error');
    }
  };

  document.querySelectorAll('.tabs button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      currentTab = b.dataset.tab;
      $('tab-clients').style.display = currentTab === 'clients' ? 'block' : 'none';
      $('tab-users').style.display = currentTab === 'users' ? 'block' : 'none';
      loadCurrentTab();
    });
  });

  $('btn-login').addEventListener('click', async () => {
    const password = $('password').value;
    const msg = $('msg-login');
    msg.textContent = 'verifying…';
    msg.style.color = 'var(--muted)';
    $('btn-login').disabled = true;

    try {
      const r = await fetch('/api/admin2/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (r.ok) {
        $('password').value = '';
        msg.textContent = '';
        showPanel();
      } else {
        const d = await r.json().catch(() => ({}));
        msg.textContent = d.error || 'invalid';
        msg.style.color = 'var(--red)';
      }
    } catch {
      msg.textContent = 'network error';
      msg.style.color = 'var(--red)';
    }

    $('btn-login').disabled = false;
  });

  $('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('btn-login').click();
  });

  $('btn-logout').addEventListener('click', async () => {
    try { await fetch('/api/admin2/logout', { method: 'POST', credentials: 'same-origin' }); } catch {}
    showLogin();
  });

  (async () => {
    try {
      const r = await fetch('/api/admin2/me', { credentials: 'same-origin', cache: 'no-store' });
      if (r.ok) showPanel(); else showLogin();
    } catch { showLogin(); }
  })();
</script>
</body>
</html>
